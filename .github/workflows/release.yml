name: Build release package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate plugin
        run: npm run validate

      - name: Create Stream Deck package
        run: npm run pack -- --force --output dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.streamDeckPlugin --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.streamDeckPlugin \
              --title "Resolume Monitor $GITHUB_REF_NAME" \
              --generate-notes
          fi
